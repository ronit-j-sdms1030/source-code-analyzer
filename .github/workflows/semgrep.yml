name: Semgrep Scan

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Ensure SEMGREP_APP_TOKEN is configured
        run: |
          if [ -z "${{ secrets.SEMGREP_APP_TOKEN }}" ]; then
            echo "::error::SEMGREP_APP_TOKEN is required but missing. Without it, Semgrep will run unauthenticated and censor secrets."
            exit 1
          fi
      - name: Run Semgrep
        run: semgrep scan --config auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
