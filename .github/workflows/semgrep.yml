name: Semgrep Scan

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Ensure Semgrep OSS is installed
        run: |
          if ! command -v semgrep &> /dev/null; then
            echo "::error::Semgrep OSS CLI is not installed."
            exit 1
          fi
          semgrep --version
      - name: Run Semgrep
        run: semgrep scan --config auto
